name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AbymanyuNWR
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-snake.svg
            dist/occean.svg?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Push to output branch (merge-safe)
        run: |
          # Save generated files to tmp before switching branches
          mkdir -p /tmp/snake_dist
          cp -r dist/* /tmp/snake_dist/ || true
          ls -R dist || true
          ls -R /tmp/snake_dist || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin output || echo "no output branch yet"
          if git ls-remote --exit-code --heads origin output; then
            git checkout output
            git pull origin output --rebase || true
          else
            git checkout --orphan output
            git rm -rf . || true
          fi
          cp -r /tmp/snake_dist/* . || true
          ls -la
          git add .
          git diff --staged --quiet || git commit -m "chore: update snake animation"
          git push origin output || echo "push failed, retrying"
          git checkout main || git checkout -b main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
